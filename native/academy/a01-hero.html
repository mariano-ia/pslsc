<!--
  Bloque A01 · Apertura — Academy. 🟩 Nativo.
  La Academy es lo ÚNICO del club que ya es real y ya juega. El hero abre con el contraste temporal:
  el primer equipo debuta en 2027, pero la comunidad ya está acá HOY. CTA primario → #tryouts (el fix
  del CTA "Academy tryouts" que hoy no lleva a nada). Fondo: video de la academia (hero_academy.mp4)
  + poster de fallback (mismo patrón que el hero de Sumate/Partners). reduced-motion → muestra el poster.
-->
<section class="acad-hero surface-ink" id="top">
  <div class="acad-hero__bg" aria-hidden="true" data-parallax="0.10">
    <!-- El poster va como <img> real: es el elemento LCP (~37 KB) y pinta enseguida.
         El <video> arranca sin src y lo carga initHeroVideo() despues del load de la
         pagina (ver el .js del bloque) — asi el hero no espera 1,4 MB para pintar. -->
    <img class="acad-hero__poster" data-hero-poster src="/assets/images/pslsc_academy.webp" alt="" width="1536" height="1024"
         fetchpriority="high" decoding="async" />
    <video class="acad-hero__video" data-hero-video="/assets/videos/hero_academy.mp4" loop muted playsinline preload="none"></video>
  </div>
  <div class="acad-hero__scrim" aria-hidden="true"></div>

  <div class="psl-container acad-hero__content">
    <div class="acad-hero__eyebrow">
      <span class="acad-hero__dot" aria-hidden="true"></span>
      <span>Youth · Tryouts open for 2026–27</span>
    </div>
    <h1 class="acad-hero__headline">The future starts <span class="acad-hero__accent">here</span>.</h1>
    <p class="acad-hero__subhead">
      Before the first professional match, our Youth program is already building the club&rsquo;s future. Young
      players are training, competing, and developing on the Treasure Coast as part of the Port St.
      Lucie SC pathway.
    </p>
    <div class="acad-hero__ctas">
      <a href="#tryouts" class="psl-btn cta-primary"><span>Tryouts</span> <span aria-hidden="true">→</span></a>
      <a href="#pathway" class="psl-btn cta-secondary">See the pathway</a>
    </div>
  </div>

  <div class="acad-hero__divider" role="presentation"></div>
</section>
