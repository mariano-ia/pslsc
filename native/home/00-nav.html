<!--
  Nav — header compartido a las 5 páginas (Home, Academy, Staff, Sumate/Join Us, Partners). 🟩 Nativo.
  Diseño adoptado de Home.dc.html: sticky con blur, badge hexagonal PSL, wordmark + est. line, CTA pill.

  Links: ya son rutas reales de WordPress (/home/, /academy-2/, /staff-2/, /joinus/, /partners/), no
  "archivo.html#ancla" — se pegan tal cual en cualquiera de las 5 páginas. Los que apuntan a "/home/#id"
  (Teams, Shop, News) solo tienen sentido como anclas dentro de Home: en las otras páginas SÍ navegan
  (no hacen scroll local), van a Home y una vez ahí el navegador salta a esa sección.

  JS: self-contained, ver tools/build-blocks-manual.py → SELF_CONTAINED_NAV_BLOCKS / nav_only_js().
  No depende de psl-{page}-motion-core.html (mismo motivo que el footer: se pega en WP sin garantía
  de que el core ya esté cargado antes en esa sección de la página). Repite el mismo bloque compilado
  psl-home-00-nav.html en las 5 páginas, igual que se hizo con el footer (09-cierre-footer).

  Mobile: hoy sin menú desplegable — .nav__links se oculta por completo debajo de 900px (ver
  00-nav.css), queda solo crest + CTA. Si se pide un menú hamburguesa esto hay que revisarlo aparte.
-->
