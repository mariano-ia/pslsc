<script type="module" src="data:text/javascript;charset=utf-8,/**%0A * PSL SC — Sistema de motion compartido. 🟩 Núcleo.%0A *%0A * Dirigido por data-atributos, sin dependencias, portable a WordPress (encolar global con type=module).%0A * Cada bloque se %22declara%22 con atributos en su HTML; este módulo los activa. En el preview, el%0A * ensamblador llama initMotion() después de inyectar los bloques; en WP corre solo en DOMContentLoaded.%0A *%0A * API de data-atributos:%0A *   [data-reveal]                 → aparece (fade+rise) al entrar en viewport. Variantes:%0A *                                   data-reveal=%22left|right|scale|mask%22. data-reveal-delay=%22120%22 (ms).%0A *   [data-reveal-group=%2290%22]      → aplica stagger (90ms) a sus hijos directos [data-reveal]%0A *                                   (o a los [data-reveal-item] descendientes si existen).%0A *   [data-parallax=%220.15%22]        → parallax vertical sutil ligado al scroll.%0A *   [data-tilt=%226%22]               → inclinación 3D siguiendo el puntero (grados máx).%0A *   [data-spotlight]              → halo aqua que sigue el cursor (usa ::after en motion.css).%0A *   [data-magnetic=%220.3%22]         → el elemento se %22imanta%22 hacia el cursor.%0A *   [data-countdown=%222027-03-01%22] → escribe los días restantes en [data-countdown-num] (o en sí mismo).%0A *%0A * Piezas globales (una sola vez): nav reactiva (progreso + sección activa),%0A * grano, cursor-glow, costuras ink↔paper. Todo respeta prefers-reduced-motion y pointer coarse.%0A */%0A%0Aconst reduce = () =%3E window.matchMedia('(prefers-reduced-motion: reduce)').matches;%0Aconst finePointer = () =%3E window.matchMedia('(hover: hover) and (pointer: fine)').matches;%0Aconst rafThrottle = (fn) =%3E {%0A  let scheduled = 0;%0A  return () =%3E { if (!scheduled) scheduled = requestAnimationFrame(() =%3E { scheduled = 0; fn(); }); };%0A};%0A%0A/* ---------- Reveal (IntersectionObserver) ---------- */%0Alet revealObserver = null;%0Afunction ensureRevealObserver() {%0A  if (revealObserver) return revealObserver;%0A  revealObserver = new IntersectionObserver((entries) =%3E {%0A    entries.forEach((e) =%3E {%0A      if (!e.isIntersecting) return;%0A      const el = e.target;%0A      el.classList.add('is-revealed');%0A      revealObserver.unobserve(el);%0A      // Al terminar la aparición liberamos el elemento: quitamos [data-reveal] para que su estado%0A      // %22revelado%22 (transform:none) deje de pisar los :hover con transform (lift/zoom de las cards).%0A      const delay = parseFloat(getComputedStyle(el).getPropertyValue('--reveal-delay')) || 0;%0A      setTimeout(() =%3E {%0A        el.removeAttribute('data-reveal');%0A        el.classList.remove('is-revealed');%0A        el.style.removeProperty('--reveal-delay');%0A      }, delay + 900);%0A    });%0A  }, { rootMargin: '0px 0px -8%25 0px', threshold: 0.06 });%0A  return revealObserver;%0A}%0Afunction initReveal(root) {%0A  if (reduce()) {%0A    // sin motion: liberamos el atributo (nada oculto, y los :hover con transform quedan libres)%0A    root.querySelectorAll('[data-reveal]').forEach((el) =%3E el.removeAttribute('data-reveal'));%0A    return;%0A  }%0A  const obs = ensureRevealObserver();%0A  // grupos: reparten el delay incremental entre sus items (los items ya llevan [data-reveal] en el HTML)%0A  root.querySelectorAll('[data-reveal-group]').forEach((g) =%3E {%0A    if (g.dataset.revGroupBound) return;%0A    g.dataset.revGroupBound = '1';%0A    const step = parseInt(g.dataset.revealGroup, 10) || 80;%0A    const explicit = g.querySelectorAll('[data-reveal-item]');%0A    const items = explicit.length ? explicit : g.querySelectorAll(':scope %3E [data-reveal]');%0A    items.forEach((it, i) =%3E it.style.setProperty('--reveal-delay', `${i * step}ms`));%0A  });%0A  root.querySelectorAll('[data-reveal]').forEach((el) =%3E {%0A    if (el.dataset.revBound) return;%0A    el.dataset.revBound = '1';%0A    if (el.dataset.revealDelay) el.style.setProperty('--reveal-delay', `${el.dataset.revealDelay}ms`);%0A    obs.observe(el);%0A  });%0A}%0A%0A/* ---------- Parallax vertical ---------- */%0Aconst parallaxEls = [];%0Alet parallaxWired = false;%0Afunction initParallax(root) {%0A  if (reduce()) return;%0A  root.querySelectorAll('[data-parallax]').forEach((el) =%3E {%0A    if (el.dataset.pxBound) return;%0A    el.dataset.pxBound = '1';%0A    parallaxEls.push({ el, k: parseFloat(el.dataset.parallax) || 0.15 });%0A  });%0A  if (!parallaxEls.length || parallaxWired) return;%0A  parallaxWired = true;%0A  const update = () =%3E {%0A    const vh = window.innerHeight;%0A    parallaxEls.forEach(({ el, k }) =%3E {%0A      const r = el.getBoundingClientRect();%0A      const center = r.top + r.height / 2;%0A      const off = (center - vh / 2) * -k;%0A      el.style.transform = `translate3d(0, ${off.toFixed(1)}px, 0)`;%0A    });%0A  };%0A  const onScroll = rafThrottle(update);%0A  window.addEventListener('scroll', onScroll, { passive: true });%0A  window.addEventListener('resize', onScroll, { passive: true });%0A  update();%0A}%0A%0A/* ---------- Tilt 3D ---------- */%0Afunction initTilt(root) {%0A  if (reduce() || !finePointer()) return;%0A  root.querySelectorAll('[data-tilt]').forEach((el) =%3E {%0A    if (el.dataset.tiltBound) return;%0A    el.dataset.tiltBound = '1';%0A    const max = parseFloat(el.dataset.tilt) || 6;%0A    el.addEventListener('pointermove', (e) =%3E {%0A      const r = el.getBoundingClientRect();%0A      const px = (e.clientX - r.left) / r.width - 0.5;%0A      const py = (e.clientY - r.top) / r.height - 0.5;%0A      el.style.transform = `perspective(820px) rotateX(${(-py * max).toFixed(2)}deg) rotateY(${(px * max).toFixed(2)}deg)`;%0A    });%0A    el.addEventListener('pointerleave', () =%3E { el.style.transform = ''; });%0A  });%0A}%0A%0A/* ---------- Spotlight (cursor-follow) ---------- */%0Afunction initSpotlight(root) {%0A  if (!finePointer()) return;%0A  root.querySelectorAll('[data-spotlight]').forEach((el) =%3E {%0A    if (el.dataset.spotBound) return;%0A    el.dataset.spotBound = '1';%0A    el.addEventListener('pointermove', (e) =%3E {%0A      const r = el.getBoundingClientRect();%0A      el.style.setProperty('--mx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%25`);%0A      el.style.setProperty('--my', `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%25`);%0A    });%0A  });%0A}%0A%0A/* ---------- Magnético ---------- */%0Afunction initMagnetic(root) {%0A  if (reduce() || !finePointer()) return;%0A  root.querySelectorAll('[data-magnetic]').forEach((el) =%3E {%0A    if (el.dataset.magBound) return;%0A    el.dataset.magBound = '1';%0A    const s = parseFloat(el.dataset.magnetic) || 0.3;%0A    el.addEventListener('pointermove', (e) =%3E {%0A      const r = el.getBoundingClientRect();%0A      const mx = e.clientX - (r.left + r.width / 2);%0A      const my = e.clientY - (r.top + r.height / 2);%0A      el.style.transform = `translate(${(mx * s).toFixed(1)}px, ${(my * s).toFixed(1)}px)`;%0A    });%0A    el.addEventListener('pointerleave', () =%3E { el.style.transform = ''; });%0A  });%0A}%0A%0A/* ---------- Countdown (días para el primer silbato) ---------- */%0Afunction initCountdown(root) {%0A  root.querySelectorAll('[data-countdown]').forEach((el) =%3E {%0A    if (el.dataset.cdBound) return;%0A    el.dataset.cdBound = '1';%0A    const target = new Date(`${el.dataset.countdown}T00:00:00`);%0A    const numEl = el.querySelector('[data-countdown-num]') || el;%0A    const days = Math.max(0, Math.ceil((target.getTime() - Date.now()) / 86400000));%0A    numEl.textContent = days.toLocaleString('en-US');%0A  });%0A}%0A%0A/* ---------- Nav reactiva (condensa + barra de progreso + sección activa) ---------- */%0A%0A/* ---------- Grano (textura sutil, global) ---------- */%0A%0A/* ---------- Cursor glow (halo aqua que sigue el puntero, solo desktop) ---------- */%0A%0A/* ---------- Costuras ink↔paper (suaviza el corte entre superficies) ---------- */%0A%0A/* ---------- Init ---------- */%0Afunction initMotion(root){root.classList.add('psl-motion');initReveal(root);initParallax(root);initTilt(root);initSpotlight(root);initMagnetic(root);initCountdown(root);}%0A%0A%0A%0A%0A%0A/**%0A * Banner Season Tickets — %22sticky%22 portable a WordPress.%0A *%0A * position: sticky solo pega dentro del bloque padre, y en WP cada bloque es una caja del alto del%0A * banner. Por eso: el hueco original (.st-banner-slot) se queda en el flujo con su alto, y cuando su%0A * borde superior pasa por debajo de la nav, el banner pasa a position: fixed con el mismo left/width%0A * del hueco y top = alto de la nav. Al volver a subir, vuelve al flujo. Scroll y resize con rAF.%0A *%0A * data-stick-under: selector del elemento bajo el que se pega (default %22.nav%22). Si no existe (WordPress),%0A * se detecta sola la barra superior fija/sticky del template; si tampoco, data-stick-top en px (default 0).%0A * data-stick-gap: aire en px entre la nav y el banner pegado (default 16).%0A */%0Afunction initBanner(root = document) {%0A  const block = root.querySelector('.st-banner-block');%0A  if (!block) return;%0A  const slot = block.querySelector('.st-banner-slot');%0A  const bar = block.querySelector('.st-banner');%0A  if (!slot || !bar) return;%0A  if (block.dataset.buyHref) bar.setAttribute('href', block.dataset.buyHref);%0A  const gap = parseFloat(block.dataset.stickGap || '16') || 0;   // aire entre la nav y el banner pegado%0A%0A  // Barra superior bajo la que se pega. 1) data-stick-under (selector); 2) si no existe (en WordPress la nav%0A  // es del template y no se llama .nav), se busca sola: el primer %3Cheader%3E/%3Cnav%3E/[class*=header|nav] con%0A  // position fixed o sticky pegado arriba; 3) data-stick-top en px (default 0).%0A  const findTopBar = () =%3E {%0A    const sel = block.dataset.stickUnder;%0A    const el = sel ? document.querySelector(sel) : null;%0A    if (el) return el;%0A    for (const c of document.querySelectorAll('header, nav, [class*=%22header%22], [class*=%22navbar%22], [class*=%22site-nav%22], [class*=%22masthead%22]')) {%0A      const cs = getComputedStyle(c);%0A      if ((cs.position === 'fixed' || cs.position === 'sticky') %26%26 c.getBoundingClientRect().top %3C= 1 %26%26 c.getBoundingClientRect().height %3C 220) return c;%0A    }%0A    return null;%0A  };%0A  const navEl = findTopBar();%0A  const stickTop = () =%3E {%0A    // borde INFERIOR real de la nav (no su alto): la nav se compacta / se desplaza al scrollear%0A    const h = navEl ? Math.max(0, navEl.getBoundingClientRect().bottom) : 0;%0A    return h || parseFloat(block.dataset.stickTop || '0') || 0;%0A  };%0A%0A  let stuck = false;%0A  const update = () =%3E {%0A    const top = stickTop();%0A    const r = slot.getBoundingClientRect();%0A    const should = r.top %3C= top + gap;%0A    if (should !== stuck) {%0A      stuck = should;%0A      bar.classList.toggle('is-stuck', stuck);%0A      if (!stuck) { bar.style.top = ''; bar.style.left = ''; bar.style.width = ''; }%0A    }%0A    if (stuck) {%0A      bar.style.top = `${top + gap}px`;%0A      bar.style.left = `${r.left}px`;%0A      bar.style.width = `${r.width}px`;%0A    }%0A  };%0A  // Tras cada scroll/resize se sigue midiendo durante ~450 ms: la nav se compacta con una transición%0A  // DESPUÉS de que el scroll termina, y sin este %22asentamiento%22 el banner quedaría a la altura vieja.%0A  let until = 0, running = false;%0A  const loop = () =%3E {%0A    update();%0A    if (performance.now() %3C until) requestAnimationFrame(loop); else running = false;%0A  };%0A  const schedule = () =%3E {%0A    until = performance.now() + 450;%0A    if (!running) { running = true; requestAnimationFrame(loop); }%0A  };%0A  addEventListener('scroll', schedule, { passive: true });%0A  addEventListener('resize', schedule, { passive: true });%0A  if (navEl %26%26 'ResizeObserver' in window) new ResizeObserver(schedule).observe(navEl);%0A  update();%0A}%0A%0A%0A%0A%0Afunction pslVw(){document.documentElement.style.setProperty('--psl-vw',document.documentElement.clientWidth+'px');}%0ApslVw(); addEventListener('resize',pslVw,{passive:true});%0Afunction pslBoot(){ document.querySelectorAll('.pslsc').forEach(function(r){if(r.dataset.pslBooted)return;r.dataset.pslBooted='1';initMotion(r);initBanner(r);}); if(window.__pslDiag) window.__pslDiag(); }%0Aif(document.readyState==='loading') document.addEventListener('DOMContentLoaded',pslBoot); else pslBoot();%0A"></script>
