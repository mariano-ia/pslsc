<script type="module" src="data:text/javascript;charset=utf-8,/* Bloque 01e · Banner Groundbreaking — cuenta regresiva (la misma de 01d) + video de fondo que corre una vez.%0A%0A   Video: nace sin src. Se precarga cuando el banner está cerca (300 px), arranca cuando se ve la mitad, se pausa si%0A   sale de pantalla y, al terminar, se funde a la foto fija (el poster ES el cuadro final de la intro: no hay salto).%0A   No vuelve a arrancar. Con reduced motion ni se baja; si el autoplay está bloqueado, prueba en el primer toque y,%0A   si no, queda la foto. Nunca pantalla negra. */%0A/* Bloque 01d · Hero Groundbreaking — cuenta regresiva al 12/12 (10 AM ET, fecha en data-gb-countdown).%0A   Escribe días/horas/minutos/segundos y muestra la tira (sin JS queda oculta). En cero se queda en 00%0A   y la tira pasa a .is-zero (para ese día el bloque ya se habrá sacado de la Home). */%0Afunction initGbCountdown(root = document) {%0A  root.querySelectorAll('[data-gb-countdown]').forEach((el) =%3E {%0A    if (el.dataset.gbBound) return;%0A    el.dataset.gbBound = '1';%0A    const target = new Date(el.dataset.gbCountdown).getTime();%0A    if (Number.isNaN(target)) return;%0A    const out = {};%0A    el.querySelectorAll('[data-u]').forEach((n) =%3E { out[n.dataset.u] = n; });%0A    const pad = (n) =%3E String(n).padStart(2, '0');%0A    let timer = 0;%0A    const tick = () =%3E {%0A      const s = Math.max(0, Math.floor((target - Date.now()) / 1000));%0A      if (out.d) out.d.textContent = pad(Math.floor(s / 86400));%0A      if (out.h) out.h.textContent = pad(Math.floor(s / 3600) %25 24);%0A      if (out.m) out.m.textContent = pad(Math.floor(s / 60) %25 60);%0A      if (out.s) out.s.textContent = pad(s %25 60);%0A      if (s === 0) { el.classList.add('is-zero'); clearInterval(timer); }%0A    };%0A    tick();%0A    el.hidden = false;%0A    timer = setInterval(tick, 1000);%0A  });%0A}%0A%0A%0A%0Afunction initGbBanner(root = document) {%0A  root.querySelectorAll('[data-gb-banner]').forEach((box) =%3E {%0A    const vid = box.querySelector('[data-gb-video]');%0A    if (!vid || vid.dataset.gbBound) return;%0A    vid.dataset.gbBound = '1';%0A    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;%0A%0A    let loaded = false;%0A    let done = false;%0A    const load = () =%3E {%0A      if (loaded) return;%0A      loaded = true;%0A      vid.preload = 'auto';%0A      vid.src = vid.dataset.gbVideo;%0A    };%0A    const play = () =%3E {%0A      if (done) return;%0A      load();%0A      vid.muted = true;%0A      const p = vid.play();%0A      if (p %26%26 typeof p.then === 'function') {%0A        p.then(() =%3E vid.classList.add('is-playing'))%0A          .catch(() =%3E window.addEventListener('pointerdown', play, { once: true }));%0A      }%0A    };%0A    vid.addEventListener('ended', () =%3E { done = true; vid.classList.add('is-done'); });%0A%0A    if (!('IntersectionObserver' in window)) { play(); return; }%0A    new IntersectionObserver((en) =%3E { if (en[0].isIntersecting) load(); }, { rootMargin: '300px 0px' }).observe(box);%0A    new IntersectionObserver((en) =%3E {%0A      if (en[0].isIntersecting) play();%0A      else if (loaded %26%26 !done) vid.pause();%0A    }, { threshold: 0.5 }).observe(box);%0A  });%0A}%0A%0A%0A%0A%0Afunction pslVw(){document.documentElement.style.setProperty('--psl-vw',document.documentElement.clientWidth+'px');}%0ApslVw(); addEventListener('resize',pslVw,{passive:true});%0Afunction pslBoot(){ document.querySelectorAll('.pslsc[data-psl-block=%22home/01e-banner-groundbreaking%22]').forEach(function(r){if(r.dataset.pslReady)return;r.dataset.pslReady='1';initGbCountdown(r);initGbBanner(r);r.dataset.pslBooted='1';}); if(window.__pslDiag) window.__pslDiag(); }%0Aif(document.readyState==='loading') document.addEventListener('DOMContentLoaded',pslBoot); else pslBoot();%0A"></script>
