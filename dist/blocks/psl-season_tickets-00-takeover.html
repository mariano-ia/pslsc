<script type="module" src="data:text/javascript;charset=utf-8,/**%0A * Takeover — Season Tickets (solo mobile). 🟦 A medida.%0A *%0A * Secuencia: overlay con el video (poster = primer frame real = la home falsa) → al `ended` se%0A * muestra el último frame REAL del video como imagen en la misma caja (corte exacto) → entran los%0A * dos CTA. %22I don't want%22 cierra el overlay con fade y destraba el scroll: queda esta misma página.%0A * %22Buy%22 navega a data-buy-href (pasarela.html, placeholder; en WP el permalink real). El video se muestra%0A * en cada carga salvo data-once=%22session%22.%0A *%0A * Robustez: desktop o sesión ya descartada → el overlay se saca antes de hacer nada; el video se%0A * carga SOLO en mobile (src desde data-src); si play() rechaza, el video da error o no arranca en%0A * 6 s (ahorro de datos / bajo consumo) → directo a la interfaz; red de seguridad por duración.%0A * prefers-reduced-motion → sin video, directo a la interfaz.%0A *%0A * Sin dependencias, portable a WordPress (tools/build-blocks.py lo empaqueta y llama initTakeover(root)).%0A */%0Aconst MOBILE = '(max-width: 820px)';%0Aconst SESSION_KEY = 'psl-season-tickets-takeover';%0A%0Afunction initTakeover(root = document) {%0A  const ov = root.querySelector('.st-takeover');%0A  if (!ov) return;%0A  const video = ov.querySelector('.st-takeover__video');%0A  const buy = ov.querySelector('.st-takeover__buy');%0A  const skip = ov.querySelector('.st-takeover__skip');%0A%0A  // Por defecto el video se muestra en CADA carga (decisión 2026-10-06). Con data-once=%22session%22 en la%0A  // section, se muestra una vez por sesión (sessionStorage).%0A  const once = ov.dataset.once === 'session';%0A  let seen = false;%0A  if (once) { try { seen = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (_) { /* storage bloqueado */ } }%0A  if (!matchMedia(MOBILE).matches || seen) { ov.remove(); return; }%0A%0A  if (ov.dataset.buyHref) buy.setAttribute('href', ov.dataset.buyHref);%0A%0A  // scroll lock (inline: el CSS del bloque va namespaceado en WP y no puede tocar %3Chtml%3E)%0A  const html = document.documentElement, body = document.body;%0A  const prev = { h: html.style.overflow, b: body.style.overflow };%0A  html.style.overflow = 'hidden'; body.style.overflow = 'hidden';%0A  const unlock = () =%3E { html.style.overflow = prev.h; body.style.overflow = prev.b; };%0A  const remember = () =%3E { if (!once) return; try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (_) { /* noop */ } };%0A%0A  let done = false, stall = 0, hard = 0;%0A  const finish = () =%3E {%0A    if (done) return;%0A    done = true; clearTimeout(stall); clearTimeout(hard);%0A    try { video.pause(); } catch (_) { /* noop */ }%0A    ov.classList.add('is-final');%0A    requestAnimationFrame(() =%3E requestAnimationFrame(() =%3E ov.classList.add('is-cta')));%0A  };%0A  const close = () =%3E {%0A    remember(); unlock();%0A    ov.classList.add('is-closing');%0A    setTimeout(() =%3E ov.remove(), 400);%0A  };%0A  skip.addEventListener('click', close);%0A  buy.addEventListener('click', () =%3E { remember(); unlock(); });%0A%0A  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {%0A    const f = ov.querySelector('.st-takeover__final'); if (f %26%26 f.dataset.src) f.src = f.dataset.src;%0A    finish(); return;%0A  }%0A%0A  video.addEventListener('ended', finish, { once: true });%0A  video.addEventListener('error', finish, { once: true });%0A  video.addEventListener('loadedmetadata', () =%3E {%0A    clearTimeout(hard);%0A    hard = setTimeout(finish, ((video.duration || 13) + 2.5) * 1000);%0A  }, { once: true });%0A  stall = setTimeout(() =%3E { if (video.currentTime %3C 0.5) finish(); }, 6000);%0A  hard = setTimeout(finish, 20000);%0A%0A  if (video.dataset.poster) video.poster = video.dataset.poster;   // poster: solo en mobile%0A  const fin = ov.querySelector('.st-takeover__final');%0A  if (fin %26%26 fin.dataset.src) fin.src = fin.dataset.src;   // imagen final: solo en mobile%0A  video.src = video.dataset.src;%0A  const p = video.play();%0A  if (p %26%26 typeof p.catch === 'function') p.catch(finish);%0A}%0A%0A%0A%0A%0Afunction pslVw(){document.documentElement.style.setProperty('--psl-vw',document.documentElement.clientWidth+'px');}%0ApslVw(); addEventListener('resize',pslVw,{passive:true});%0Afunction pslBoot(){ document.querySelectorAll('.pslsc').forEach(function(r){if(r.dataset.pslBooted)return;r.dataset.pslBooted='1';initTakeover(r);}); if(window.__pslDiag) window.__pslDiag(); }%0Aif(document.readyState==='loading') document.addEventListener('DOMContentLoaded',pslBoot); else pslBoot();%0A"></script>
